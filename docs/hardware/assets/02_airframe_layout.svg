<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">AERIS: organize the aircraft before connecting wires</title><desc id="desc">Conceptual quad X top view with physical motor locations and protected center decks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#162337}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.note{font-size:17px}</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="42" class="title">AERIS: organize the aircraft before connecting wires</text><text x="30" y="80" class="note">View from above. FRONT is the flight-controller arrow direction after verified mounting.</text><path d="M 260 200 L 830 540 M 830 200 L 260 540" stroke="#b8c6d7" stroke-width="45"/><circle cx="260" cy="200" r="75" fill="#f2f5f8" stroke="#52647b" stroke-width="3"/><text x="212" y="192" class="small">Front-left</text><text x="205" y="215" class="small">Motor identity</text><text x="205" y="237" class="small">NOT output #</text><circle cx="830" cy="200" r="75" fill="#f2f5f8" stroke="#52647b" stroke-width="3"/><text x="782" y="192" class="small">Front-right</text><text x="775" y="215" class="small">Motor identity</text><text x="775" y="237" class="small">NOT output #</text><circle cx="260" cy="540" r="75" fill="#f2f5f8" stroke="#52647b" stroke-width="3"/><text x="212" y="532" class="small">Rear-left</text><text x="205" y="555" class="small">Motor identity</text><text x="205" y="577" class="small">NOT output #</text><circle cx="830" cy="540" r="75" fill="#f2f5f8" stroke="#52647b" stroke-width="3"/><text x="782" y="532" class="small">Rear-right</text><text x="775" y="555" class="small">Motor identity</text><text x="775" y="577" class="small">NOT output #</text><rect x="400" y="230" width="300" height="95" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="415" y="258" class="label" style="font-size:18.0px">Top / protected deck</text><text x="415" y="283" class="small" style="font-size:15.0px">Controller near center</text><text x="415" y="305" class="small" style="font-size:15.0px">Arrow and orientation verified</text><rect x="400" y="355" width="300" height="95" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="415" y="383" class="label" style="font-size:18.0px">Payload / lower deck</text><text x="415" y="408" class="small" style="font-size:15.0px">Computer secured and cooled</text><text x="415" y="430" class="small" style="font-size:15.0px">Camera clear of legs/propellers</text><polyline points="550,200 550,105" fill="none" stroke="#32804b" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="150" class="note">FRONT</text><text x="30" y="650" class="note">Place battery to meet kit center-of-gravity guidance; secure every payload against movement.</text><text x="30" y="685" class="note">No dimensions, motor numbers or rotation arrows are prescribed: copy the exact airframe mapping.</text></svg>