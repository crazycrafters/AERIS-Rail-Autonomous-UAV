<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">What the flight-controller motherboard does</title><desc id="desc">Logical flight-controller board blocks and interface categories; not a physical connector map.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#162337}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.note{font-size:17px}</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="42" class="title">What the flight-controller motherboard does</text><rect x="300" y="125" width="490" height="425" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="315" y="153" class="label" style="font-size:18.0px">Flight-controller board: logical functions</text><text x="315" y="178" class="small" style="font-size:14.7px">Not a photograph, scale drawing or actual pin arrangement</text><rect x="335" y="215" width="190" height="105" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="350" y="243" class="label" style="font-size:16.2px">Control processor</text><text x="350" y="268" class="small" style="font-size:13.2px">Real-time flight logic</text><text x="350" y="290" class="small" style="font-size:15.0px">Not the AI computer</text><rect x="565" y="215" width="190" height="105" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="580" y="243" class="label" style="font-size:17.2px">Inertial sensors</text><text x="580" y="268" class="small" style="font-size:10.8px">Gyroscopes + accelerometers</text><text x="580" y="290" class="small" style="font-size:10.8px">Pressure sensor as supplied</text><rect x="335" y="365" width="190" height="110" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="350" y="393" class="label" style="font-size:15.3px">Power / regulation</text><text x="350" y="418" class="small" style="font-size:14.5px">Approved power input</text><text x="350" y="440" class="small" style="font-size:12.6px">USB rules vary by board</text><rect x="565" y="365" width="190" height="110" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="580" y="393" class="label" style="font-size:13.8px">Logging / interfaces</text><text x="580" y="418" class="small" style="font-size:13.9px">Supported log storage</text><text x="580" y="440" class="small" style="font-size:12.1px">Signal buses and outputs</text><rect x="20" y="120" width="250" height="85" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="35" y="148" class="label" style="font-size:18.0px">POWER</text><text x="35" y="173" class="small" style="font-size:15.0px">Approved power module</text><polyline points="270,162 300,162" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="270" width="250" height="85" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="35" y="298" class="label" style="font-size:18.0px">GNSS / RC</text><text x="35" y="323" class="small" style="font-size:15.0px">Exact port depends on kit</text><polyline points="270,312 300,312" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="420" width="250" height="85" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="35" y="448" class="label" style="font-size:18.0px">USB / TELEM</text><text x="35" y="473" class="small" style="font-size:15.0px">MAVLink to companion</text><polyline points="270,462 300,462" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="120" width="250" height="85" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="845" y="148" class="label" style="font-size:18.0px">ACTUATOR outputs</text><text x="845" y="173" class="small" style="font-size:15.0px">Signals to ESCs</text><polyline points="790,162 830,162" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="270" width="250" height="85" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="845" y="298" class="label" style="font-size:18.0px">CAN / I2C</text><text x="845" y="323" class="small" style="font-size:15.0px">Supported peripherals</text><polyline points="790,312 830,312" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="420" width="250" height="85" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="845" y="448" class="label" style="font-size:18.0px">Status / logging</text><text x="845" y="473" class="small" style="font-size:15.0px">LEDs, buzzer, log card</text><polyline points="790,462 830,462" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="620" class="note">A computer carrier board has different ports: power, USB/CSI, storage, network and optional UART.</text><text x="30" y="660" class="note">Do not identify a connector by shape or wire color. Use exact model + revision + official drawing.</text></svg>