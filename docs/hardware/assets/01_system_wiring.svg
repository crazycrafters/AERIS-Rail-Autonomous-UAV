<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">AERIS: power and data belong to different paths</title><desc id="desc">Conceptual wiring for a kit aircraft with a separate flight controller and companion computer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#162337}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.note{font-size:17px}</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="42" class="title">AERIS: power and data belong to different paths</text><rect x="30" y="95" width="250" height="100" rx="12" fill="#fff0dd" stroke="#52647b" stroke-width="2"/><text x="45" y="123" class="label" style="font-size:18.0px">Flight battery</text><text x="45" y="148" class="small" style="font-size:15.0px">Use kit-matched pack</text><text x="45" y="170" class="small" style="font-size:15.0px">Connect only after checks</text><rect x="370" y="95" width="330" height="100" rx="12" fill="#fff0dd" stroke="#52647b" stroke-width="2"/><text x="385" y="123" class="label" style="font-size:18.0px">Rated power distribution</text><text x="385" y="148" class="small" style="font-size:15.0px">Motor power + approved module</text><text x="385" y="170" class="small" style="font-size:15.0px">Regulator input must match battery</text><polyline points="280,145 370,145" fill="none" stroke="#b94621" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="90" width="265" height="110" rx="12" fill="#fff0dd" stroke="#52647b" stroke-width="2"/><text x="815" y="118" class="label" style="font-size:18.0px">ESCs + four motors</text><text x="815" y="143" class="small" style="font-size:15.0px">High-current power branch</text><text x="815" y="165" class="small" style="font-size:12.2px">Controller sends signals separately</text><polyline points="700,145 800,145" fill="none" stroke="#b94621" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="280" width="330" height="115" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="375" y="308" class="label" style="font-size:18.0px">Flight controller / Pixhawk</text><text x="375" y="333" class="small" style="font-size:15.0px">PX4 firmware; stabilization</text><text x="375" y="355" class="small" style="font-size:15.0px">Approved power-module input</text><text x="375" y="377" class="small" style="font-size:15.0px">Independent operator control</text><polyline points="500,195 500,280" fill="none" stroke="#b94621" stroke-width="3" marker-end="url(#arrow)"/><polyline points="690,310 740,310 740,225 930,225 930,200" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="280" width="250" height="115" rx="12" fill="#e9f6ed" stroke="#52647b" stroke-width="2"/><text x="45" y="308" class="label" style="font-size:18.0px">GNSS + RC receiver</text><text x="45" y="333" class="small" style="font-size:15.0px">Use supported kit cables</text><text x="45" y="355" class="small" style="font-size:11.8px">Separate navigation/operator links</text><polyline points="280,335 360,335" fill="none" stroke="#32804b" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="280" width="265" height="115" rx="12" fill="#fff0dd" stroke="#52647b" stroke-width="2"/><text x="815" y="308" class="label" style="font-size:18.0px">Dedicated DC/DC</text><text x="815" y="333" class="small" style="font-size:15.0px">Carrier-specified output</text><text x="815" y="355" class="small" style="font-size:15.0px">Never use TELEM power for AI</text><polyline points="650,195 750,250 930,250 930,280" fill="none" stroke="#b94621" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="490" width="330" height="110" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="375" y="518" class="label" style="font-size:18.0px">Companion computer</text><text x="375" y="543" class="small" style="font-size:15.0px">Linux + AERIS inference</text><text x="375" y="565" class="small" style="font-size:15.0px">Camera evidence + local storage</text><polyline points="930,395 930,545 690,545" fill="none" stroke="#b94621" stroke-width="3" marker-end="url(#arrow)"/><polyline points="515,395 515,490" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><text x="535" y="445" class="small">USB data first; UART only after pin/level checks</text><rect x="30" y="490" width="250" height="110" rx="12" fill="#e9f6ed" stroke="#52647b" stroke-width="2"/><text x="45" y="518" class="label" style="font-size:18.0px">Inspection camera</text><text x="45" y="543" class="small" style="font-size:15.0px">Supported USB 3 model</text><text x="45" y="565" class="small" style="font-size:15.0px">Optics + exposure matter</text><polyline points="280,545 360,545" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="650" class="note">RED = power route. BLUE = data/control. GREEN = supported sensor/operator link.</text><text x="30" y="685" class="note">Conceptual connections only: this is not a connector pinout or a validated aircraft design.</text></svg>