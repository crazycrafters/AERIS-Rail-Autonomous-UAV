<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Companion link: USB first, qualified UART later</title><desc id="desc">Signal direction and power separation for connecting a companion computer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#162337}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.note{font-size:17px}</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="42" class="title">Companion link: USB first, qualified UART later</text><rect x="40" y="115" width="385" height="145" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="55" y="143" class="label" style="font-size:18.0px">Controller: verified UART port</text><text x="55" y="168" class="small" style="font-size:15.0px">TX output</text><text x="55" y="190" class="small" style="font-size:15.0px">RX input</text><text x="55" y="212" class="small" style="font-size:15.0px">Signal reference ground</text><text x="55" y="234" class="small" style="font-size:15.0px">Supply pin: not joined by this drawing</text><rect x="675" y="115" width="385" height="145" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="690" y="143" class="label" style="font-size:17.5px">Companion: qualified UART interface</text><text x="690" y="168" class="small" style="font-size:15.0px">RX input</text><text x="690" y="190" class="small" style="font-size:15.0px">TX output</text><text x="690" y="212" class="small" style="font-size:15.0px">Required ground reference</text><text x="690" y="234" class="small" style="font-size:15.0px">Logic voltage must match</text><polyline points="425,170 675,170" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="675,193 425,193" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="425,215 675,215" fill="none" stroke="#32804b" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="150" class="small">Cross TX to RX</text><rect x="40" y="340" width="385" height="115" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="55" y="368" class="label" style="font-size:18.0px">USB bench alternative</text><text x="55" y="393" class="small" style="font-size:15.0px">Use supported controller USB port</text><text x="55" y="415" class="small" style="font-size:15.0px">Check power/back-power rules</text><text x="55" y="437" class="small" style="font-size:15.0px">No hand-made UART pin wiring first</text><rect x="675" y="340" width="385" height="115" rx="12" fill="#eaf0f9" stroke="#52647b" stroke-width="2"/><text x="690" y="368" class="label" style="font-size:18.0px">Companion USB host</text><text x="690" y="393" class="small" style="font-size:15.0px">Stable device identity + permissions</text><text x="690" y="415" class="small" style="font-size:15.0px">Configure MAVLink on the real port</text><text x="690" y="437" class="small" style="font-size:15.0px">No aircraft command from camera model</text><polyline points="425,395 675,395" fill="none" stroke="#2861a8" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="535" class="note">This drawing intentionally has NO pin numbers: they depend on the purchased boards and adapters.</text><text x="40" y="575" class="note">1.8 V and 3.3 V logic are not interchangeable. TTL UART is not RS-232.</text><text x="40" y="615" class="note">Use official pre-made cables where available; do not connect a Pi/Jetson power rail to TELEM.</text><text x="40" y="655" class="note">Keep propellers removed during wiring and controller output identification.</text></svg>